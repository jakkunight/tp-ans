[package]
name = "lab"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = [
  "json",
  "form",
  "query",
  "tokio",
  "tracing",
] }
axum-macros = "0.5.1"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
thiserror = "2.0.20"
askama = "0.16.1"
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.26.0", features = ["serde", "v7"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["now", "serde"] }
sqlx = { version = "0.9.0", features = [
  "derive",
  "chrono",
  "macros",
  "postgres",
  "runtime-tokio",
  "uuid",
  "tls-rustls",
] }
jsonwebtoken = { version = "11.1.0", features = ["default", "aws_lc_rs"] }
blake3 = { version = "1.8.7", features = ["digest", "pure"] }
argon2 = { version = "0.6.0-rc.8", features = ["password-hash"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
reqwest = { version = "0.13.5", features = ["json", "rustls"] }
