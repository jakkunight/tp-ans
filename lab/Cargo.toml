[package]
name = "lab"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
anyhow = "1.0.104"
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.26.0", features = ["serde", "v7"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["now"] }
sqlx = {
  version   = "0.9.0",
  features = [
    "derive",
    "chrono",
    "macros",
    "postgres",
    "runtime-tokio",
    "uuid",
    "tls-rustls",
  ]
}
